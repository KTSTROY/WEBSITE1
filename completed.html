  <style>
    /* ———————————————
       Root & Globals
       ——————————————— */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --ff-base: 'Inter', sans-serif;
      --fs-base: 16px;
      --clr-primary: #f36f21;
      --clr-dark: #222;
      --clr-gray: #555;
      --clr-light-bg: #fafafa;
      --card-bg: #fff;
      --border-radius: 8px;
      --shadow-light: rgba(0,0,0,0.05);
      --transition: 0.3s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: var(--fs-base);
    }

    body {
      font-family: var(--ff-base);
      background-color: var(--clr-light-bg);
      color: var(--clr-dark);
      line-height: 1.6;
      position: relative;
    }

    a {
      text-decoration: none;
      color: inherit;
    }
    /* ———————————————
       NAVBAR
       ——————————————— */
    .navbar {
      background: #000;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar .container.menu {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }
    
    .navbar-brand {
      position: absolute;
      left: 0;
    }
    
    .navbar-brand .navbar-logo {
      height: 40px;
      width: auto;
      transition: transform 0.3s ease;
    }
    
    .navbar-brand .navbar-logo:hover {
      transform: scale(1.05);
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    .navbar li a {
      color: #fff;
      font-weight: 600;
      transition: color var(--transition), border-bottom var(--transition);
    }

    .navbar li a:hover,
    .navbar li a.active {
      color: var(--clr-primary);
      border-bottom: 2px solid var(--clr-primary);
    }

    .hamburger {
      display: none;
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: var(--border-radius);
      padding: 0.25rem 0.35rem;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 1001;
    }

    @media (max-width: 992px) {
      .hamburger {
        display: block;
      }
      .navbar .container.menu ul {
        display: none;
      }
      .navbar .container.menu.active {
        flex-direction: column;
        align-items: flex-start;
        background: #000;
        position: absolute;
        top: 100%;
        right: 0;
        width: 80%;
        padding: 1rem;
        justify-content: flex-start;
      }
      .navbar .container.menu.active .navbar-brand {
        position: static;
        margin-bottom: 1rem;
      }
      .navbar .container.menu.active ul {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 0;
      }
      .navbar .container.menu.active ul li {
        width: 100%;
      }
      .navbar .container.menu.active ul li a {
        display: block;
        padding: 0.5rem 0;
        color: #fff;
        border: none;
        border-bottom: 1px solid #333;
      }
    }

    /* ———————————————
       CONTAINER & SECTION HEADING
       ——————————————— */
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 2rem auto;
      text-align: center;
    }

    h2.section-heading {
      font-size: 1.75rem; /* 28px */
      font-weight: 600;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }
   /* h2.section-heading::after {
      content: '';
      display: block;
      width: 50px;
      height: 4px;
      background: var(--clr-primary);
      margin: 0.5rem auto 0;
      border-radius: 2px;
    }
*/

    /* ———————————————
       CONTAINER & SECTION HEADING
       ——————————————— */
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 2rem auto;
      text-align: center;
    }

    h2.section-heading {
      font-size: 1.75rem; /* 28px */
      font-weight: 600;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }
    /* h2.section-heading::after {
      content: '';
      display: block;
      width: 50px;
      height: 4px;
      background: var(--clr-primary);
      margin: 0.5rem auto 0;
      border-radius: 2px;
    } */

    /* ———————————————
       PROJECT GRID
       ——————————————— */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    /* ———————————————
       PROJECT CARD
       ——————————————— */
    a.project-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 12px var(--shadow-light);
      overflow: hidden;
      position: relative;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    a.project-card:hover,
    a.project-card:focus {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--shadow-light);
    }
    /* overlay */
    a.project-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      transition: background var(--transition);
      z-index: 1;
    }
    a.project-card:hover::before,
    a.project-card:focus::before {
      background: rgba(0, 0, 0, 0.2);
    }
    a.project-card img,
    a.project-card .project-info {
      position: relative;
      z-index: 2;
    }
    a.project-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      transition: transform var(--transition);
    }
    a.project-card:hover img,
    a.project-card:focus img {
      transform: scale(1.05);
    }
    .project-info {
      padding: 1rem 1.25rem;
      flex: 1;
      text-align: left;
    }
    .project-info h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .project-info .meta {
      font-size: 0.9rem;
      color: var(--clr-gray);
    }
    .project-info .meta .label {
      font-weight: 500;
      color: var(--clr-primary);
    }

    /* ———————————————
       BACK TO TOP BUTTON
       ——————————————— */
    #back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--clr-primary);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 3rem;
      height: 3rem;
      font-size: 1.5rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 1002;
    }

    /* ———————————————
       FOOTER (социална икона)
       ——————————————— */
    .footer-social a i {
      color: #fff !important;
    }

    /* ———————————————
       Scroll animations (Intersection Observer)
       ——————————————— */
    .project-card {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.3s ease, transform 1.3s ease !important;
    }
    .project-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ———————————————
       Loading skeleton
       ——————————————— */
    .loading-skeleton {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }
    .skeleton-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 12px var(--shadow-light);
      overflow: hidden;
    }
    .skeleton-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    .skeleton-content {
      padding: 1rem 1.25rem;
    }
    .skeleton-title,
    .skeleton-text {
      height: 1rem;
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .skeleton-title {
      height: 1.5rem;
    }
    .skeleton-text.short {
      width: 60%;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Projects count styling */
    .projects-count {
      text-align: center;
      margin-top: 2rem;
      color: var(--clr-gray);
      font-size: 0.9rem;
    }

    /* ===== PROJECT FILTERS ===== */
    .project-filters {
      margin: 2rem 0;
      padding: 1.5rem;
      background: #fff;
      border-radius: var(--border-radius);
      box-shadow: 0 2px 8px var(--shadow-light);
    }

    .filter-search {
      position: relative;
      margin-bottom: 1.5rem;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 3px rgba(243, 111, 33, 0.1);
    }

    .filter-search i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--clr-gray);
    }

    .filter-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      border: 2px solid #e0e0e0;
      background: #fff;
      color: var(--clr-gray);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--clr-primary);
      color: var(--clr-primary);
    }

    .filter-btn.active {
      background: var(--clr-primary);
      border-color: var(--clr-primary);
      color: #fff;
    }

    /* Hide/show filtered projects */
    .project-card.hidden {
      display: none;
    }

    /* No results message */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--clr-gray);
    }

    .no-results i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #ddd;
    }

    @media (max-width: 768px) {
      .project-filters {
        padding: 1rem;
      }
      
      .filter-categories {
        justify-content: center;
      }
      
      .filter-btn {
        font-size: 0.8rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>

  <!-- Rendering & UI Script -->
  <script>
    // Hamburger toggle + close on link + outside click
    const ham = document.querySelector('.hamburger');
    const menu = document.querySelector('.container.menu');
    ham.addEventListener('click', () => menu.classList.toggle('active'));
    
    document.querySelectorAll('.container.menu ul li a').forEach(link => {
      link.addEventListener('click', () => {
        menu.classList.remove('active');
        document.querySelectorAll('.container.menu ul li a').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // Close mobile menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && !ham.contains(e.target)) {
        menu.classList.remove('active');
      }
    });

    // Back to top button
    const backBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      backBtn.style.display = window.pageYOffset > 300 ? 'flex' : 'none';
    });
    backBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Fetch projects from JSON and render
    fetch('data/projects-completed.json')
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(projects => {
        const gallery = document.getElementById('completedGallery');
        const loadingSkeleton = gallery.querySelector('.loading-skeleton');
        const projectsCount = document.getElementById('projectsCount');
        
        // Remove loading skeleton
        if (loadingSkeleton) {
          loadingSkeleton.remove();
        }

        // Store projects globally for filtering
        window.allProjects = projects;

        // Add projects count
        projectsCount.textContent = `Показване на ${projects.length} проекта`;
        projectsCount.style.display = 'block';

        // Get unique categories for filter buttons
        const categories = [...new Set(projects.map(p => p.category))];
        const categoryButtons = document.querySelectorAll('.filter-btn[data-category]');
        categoryButtons.forEach(btn => {
          const category = btn.dataset.category;
          if (category !== 'all' && !categories.includes(category)) {
            btn.style.display = 'none';
          }
        });

        function renderProjects(projectsToRender) {
          const gallery = document.getElementById('completedGallery');
          // Clear existing projects but keep loading skeleton if present
          const existingCards = gallery.querySelectorAll('.project-card');
          existingCards.forEach(card => card.remove());
          
          if (projectsToRender.length === 0) {
            const noResults = document.createElement('div');
            noResults.className = 'no-results';
            noResults.innerHTML = `
              <i class="fas fa-search"></i>
              <h3>Няма намерени проекти</h3>
              <p>Опитайте с различни критерии за търсене</p>
            `;
            gallery.appendChild(noResults);
            projectsCount.textContent = 'Няма намерени проекти';
            return;
          }

          projectsToRender.forEach((p, index) => {
            const card = document.createElement('a');
            card.className = 'project-card';
            card.href = `detail.html?slug=${p.slug}&status=completed`;
            card.style.animationDelay = `${index * 0.1}s`; // Staggered animation
            card.innerHTML = `
              <img src="${p.thumb}" alt="${p.title}" loading="lazy" onerror="this.src=\\'https://via.placeholder.com/400x300?text=Изображение+не+е+намерено\\'">
              <div class="project-info">
                <h3>${p.title}</h3>
                <p class="meta">
                  <span class="label">Локация:</span><br>
                  ${p.location}<br>
                  <span class="label">Категория:</span><br>
                  ${p.category}
                </p>
              </div>`;
            gallery.appendChild(card);
          });

          // Update count
          projectsCount.textContent = `Показване на ${projectsToRender.length} от ${projects.length} проекта`;

          // Intersection Observer for fade-in
          const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                obs.unobserve(entry.target);
              }
            });
          }, { threshold: 0.1 });
          document.querySelectorAll('.project-card').forEach(card => observer.observe(card));
        }

        // Initial render
        renderProjects(projects);

        // Filter functionality
        function filterProjects() {
          const searchTerm = document.getElementById('searchInput').value.toLowerCase();
          const activeCategory = document.querySelector('.filter-btn.active').dataset.category;
          
          const filtered = window.allProjects.filter(project => {
            const matchesSearch = searchTerm === '' || 
              project.title.toLowerCase().includes(searchTerm) || 
              project.location.toLowerCase().includes(searchTerm) ||
              project.category.toLowerCase().includes(searchTerm);
            
            const matchesCategory = activeCategory === 'all' || project.category === activeCategory;
            
            return matchesSearch && matchesCategory;
          });
          
          renderProjects(filtered);
        }

        // Search input event
        document.getElementById('searchInput').addEventListener('input', filterProjects);

        // Category filter events
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterProjects();
          });
        });
      })
      .catch(error => {
        console.error('Error loading projects:', error);
        const gallery = document.getElementById('completedGallery');
        const loadingSkeleton = gallery.querySelector('.loading-skeleton');
        if (loadingSkeleton) {
          loadingSkeleton.remove();
        }
        
        gallery.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 2rem;">
            <p style="color: #d32f2f; font-size: 1.1rem; margin-bottom: 1rem;">
              <i class="fas fa-exclamation-triangle"></i> Не може да се зареди съдържанието
            </p>
            <p style="color: #666; margin-bottom: 1rem;">За да видите проектите, отворете сайта чрез локален сървър.</p>
            <p style="color: #888; font-size: 0.9rem;">
              Пример: <code>python3 -m http.server 8000</code> или <code>npx http-server</code>
            </p>
            <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer;">
              Опитай отново
            </button>
          </div>`;
          
        // Hide project count
        const projectsCount = document.getElementById('projectsCount');
        if (projectsCount) {
          projectsCount.style.display = 'none';
        }
      });
  </script>
